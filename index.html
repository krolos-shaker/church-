      وحابين نقولك إن مكانك لسه موجود وسطنا.<br>
      متقولش إنك بعيد أو إن الوقت فات… تعالى، إحنا مستنيينك.<br>
      يمكن تكون محتاج كلمة، صلاة، أو حتى قعدة حلوة مع إخواتك.<br>

<script>

const verses = [
  {text:"الرَّبُّ نُورِي وَخَلَاصِي، مِمَّنْ أَخَافُ؟",ref:"مزمور 27: 1",message:"مهما كان اللي قدامك، ربنا هو نورك وسندك."},
  {text:"أَلْقِ عَلَى الرَّبِّ هَمَّكَ فَهُوَ يَعُولُكَ.",ref:"مزمور 55: 22",message:"متشيلش كل حاجة لوحدك… سلّمها لربنا."},
  {text:"كُلُّ شَيْءٍ أَسْتَطِيعُهُ فِي الْمَسِيحِ الَّذِي يُقَوِّينِي.",ref:"فيلبي 4: 13",message:"خليك واثق إن قوتك الحقيقية في المسيح."},
  {text:"لاَ تَخَفْ لأَنِّي مَعَكَ. لاَ تَتَلَفَّتْ لأَنِّي إِلَهُكَ.",ref:"إشعياء 41: 10",message:"أنت مش لوحدك… ربنا معاك في كل خطوة."},
  {text:"طَلَبْتُ إِلَى الرَّبِّ فَاسْتَجَابَ لِي، وَمِنْ كُلِّ مَخَاوِفِي أَنْقَذَنِي.",ref:"مزمور 34: 4",message:"صلّي، واتكل على ربنا، وسيب له مخاوفك."},
  {text:"الرَّبُّ رَاعِيَّ فَلاَ يُعْوِزُنِي شَيْءٌ.",ref:"مزمور 23: 1",message:"الرب راعيك، ومش هيسيبك محتاج."},
  {text:"إِنِّي مَعَكُمْ كُلَّ الأَيَّامِ إِلَى انْقِضَاءِ الدَّهْرِ.",ref:"متى 28: 20",message:"وجود المسيح معاك هو أعظم تعزية."},
  {text:"تَعَالَوْا إِلَيَّ يَا جَمِيعَ الْمُتْعَبِينَ وَالثَّقِيلِي الأَحْمَالِ، وَأَنَا أُرِيحُكُمْ.",ref:"متى 11: 28",message:"لما تتعب، تعالى للمسيح وسيب حملك عنده."},
  {text:"السَّلاَمَ أَسْتَوْدِعُكُمْ. سَلاَمِي أُعْطِيكُمْ.",ref:"يوحنا 14: 27",message:"سلام المسيح أقوى من أي ظرف."},
  {text:"لاَ تَضْطَرِبْ قُلُوبُكُمْ. آمِنُوا بِاللَّهِ وَآمِنُوا بِي.",ref:"يوحنا 14: 1",message:"الإيمان يدي قلبك ثبات وسط القلق."},
  {text:"أَنَا هُوَ الطَّرِيقُ وَالْحَقُّ وَالْحَيَاةُ.",ref:"يوحنا 14: 6",message:"المسيح هو الطريق اللي يقودك للحياة."},
  {text:"أَنَا هُوَ الْقِيَامَةُ وَالْحَيَاةُ. مَنْ آمَنَ بِي وَلَوْ مَاتَ فَسَيَحْيَا.",ref:"يوحنا 11: 25",message:"في المسيح رجاء حتى وسط الموت."},
  {text:"أَنَا هُوَ نُورُ الْعَالَمِ. مَنْ يَتْبَعْنِي فَلاَ يَمْشِي فِي الظُّلْمَةِ.",ref:"يوحنا 8: 12",message:"اتبع المسيح وخلي نوره يقود حياتك."},
  {text:"أَنَا هُوَ الْكَرْمَةُ وَأَنْتُمُ الأَغْصَانُ. مَنْ يَثْبُتْ فِيَّ وَأَنَا فِيهِ فَهَذَا يَأْتِي بِثَمَرٍ كَثِيرٍ.",ref:"يوحنا 15: 5",message:"الثبات في المسيح هو سر الثمر الحقيقي."},
  {text:"اثْبُتُوا فِيَّ وَأَنَا فِيكُمْ.",ref:"يوحنا 15: 4",message:"خليك قريب من المسيح كل يوم."},
  {text:"لأَنَّهُ هكَذَا أَحَبَّ اللهُ الْعَالَمَ حَتَّى بَذَلَ ابْنَهُ الْوَحِيدَ، لِكَيْ لاَ يَهْلِكَ كُلُّ مَنْ يُؤْمِنُ بِهِ بَلْ تَكُونُ لَهُ الْحَيَاةُ الأَبَدِيَّةُ.",ref:"يوحنا 3: 16",message:"أعظم رسالة: محبة الله ليك."},
  {text:"مَنْ يَأْتِي إِلَيَّ فَلاَ أُخْرِجْهُ خَارِجًا.",ref:"يوحنا 6: 37",message:"باب المسيح مفتوح ليك مهما كان ماضيك."},
  {text:"إِنْ كُنْتُمْ تُحِبُّونَنِي فَاحْفَظُوا وَصَايَايَ.",ref:"يوحنا 14: 15",message:"محبة المسيح تظهر في طاعتنا لوصيته."},
  {text:"أَحِبُّوا بَعْضُكُمْ بَعْضًا كَمَا أَحْبَبْتُكُمْ.",ref:"يوحنا 15: 12",message:"خلي محبة المسيح تظهر في معاملتك للناس."},
  {text:"فِي الْعَالَمِ سَيَكُونُ لَكُمْ ضِيقٌ، وَلكِنْ ثِقُوا: أَنَا قَدْ غَلَبْتُ الْعَالَمَ.",ref:"يوحنا 16: 33",message:"الضيقة مش النهاية؛ المسيح غالب."},
  {text:"كُلُّ مَنْ يَسْمَعُ كَلَامِي هذَا وَيَعْمَلُ بِهِ أُشَبِّهُهُ بِرَجُلٍ عَاقِلٍ بَنَى بَيْتَهُ عَلَى الصَّخْرِ.",ref:"متى 7: 24",message:"ابنِ حياتك على كلمة ربنا."},
  {text:"اطْلُبُوا أَوَّلاً مَلَكُوتَ اللهِ وَبِرَّهُ، وَهذِهِ كُلُّهَا تُزَادُ لَكُمْ.",ref:"متى 6: 33",message:"خلي ربنا الأول، وهو يهتم بالباقي."},
  {text:"لاَ تَهْتَمُّوا لِلْغَدِ، لأَنَّ الْغَدَ يَهْتَمُّ بِمَا لِنَفْسِهِ.",ref:"متى 6: 34",message:"عيش يومك مع ربنا وسيب بكرة في إيده."},
  {text:"كُلُّ مَنْ يَرْفَعُ نَفْسَهُ يَتَّضِعُ، وَمَنْ يَضَعُ نَفْسَهُ يَرْتَفِعُ.",ref:"متى 23: 12",message:"التواضع طريق للنعمة."},
  {text:"طُوبَى لِلرُّحَمَاءِ، لأَنَّهُمْ يُرْحَمُونَ.",ref:"متى 5: 7",message:"ارحم غيرك واختبر رحمة ربنا."},
  {text:"طُوبَى لِلْجِيَاعِ وَالْعِطَاشِ إِلَى الْبِرِّ، لأَنَّهُمْ يُشْبَعُونَ.",ref:"متى 5: 6",message:"اشتياقك للبر مش هيضيع."},
  {text:"طُوبَى لِلْحَزَانَى، لأَنَّهُمْ يَتَعَزَّوْنَ.",ref:"متى 5: 4",message:"ربنا شايف حزنك وهيعزي قلبك."},
  {text:"طُوبَى لِصَانِعِي السَّلاَمِ، لأَنَّهُمْ أَبْنَاءَ اللهِ يُدْعَوْنَ.",ref:"متى 5: 9",message:"كن سبب سلام، مش سبب خلاف."},
  {text:"أَحْبِبْ قَرِيبَكَ كَنَفْسِكَ.",ref:"متى 22: 39",message:"المحبة تبدأ من معاملتك للناس حواليك."},
  {text:"كُلُّ مَا تُرِيدُونَ أَنْ يَفْعَلَ النَّاسُ بِكُمُ افْعَلُوا هكَذَا أَنْتُمْ أَيْضًا بِهِمْ.",ref:"متى 7: 12",message:"عامل الناس بالطريقة اللي تتمنى يعاملوك بيها."},
  {text:"إِنْ كَانَ اللهُ مَعَنَا، فَمَنْ عَلَيْنَا؟",ref:"رومية 8: 31",message:"لو ربنا معاك، مفيش خوف يغلبك."},
  {text:"مَنْ سَيَفْصِلُنَا عَنْ مَحَبَّةِ الْمَسِيحِ؟",ref:"رومية 8: 35",message:"محبة المسيح أقوى من أي ضيقة."},
  {text:"فَإِنِّي مُتَيَقِّنٌ أَنَّهُ لاَ مَوْتَ وَلاَ حَيَاةَ، وَلاَ مَلاَئِكَةَ وَلاَ رُؤَسَاءَ وَلاَ قُوَّاتِ، وَلاَ أُمُورَ حَاضِرَةً وَلاَ مُسْتَقْبَلَةً، وَلاَ عُلْوَ وَلاَ عُمْقَ، وَلاَ خَلِيقَةً أُخْرَى تَقْدِرُ أَنْ تَفْصِلَنَا عَنْ مَحَبَّةِ اللهِ.",ref:"رومية 8: 38-39",message:"مفيش حاجة تقدر تفصلك عن محبة الله."},
  {text:"لاَ تَغْلِبَنَّكَ الشَّرُّ بَلِ اغْلِبِ الشَّرَّ بِالْخَيْرِ.",ref:"رومية 12: 21",message:"اختار الخير حتى لما الشر يكون أسهل."},
  {text:"فَرِحِينَ فِي الرَّجَاءِ، صَابِرِينَ فِي الضِّيقِ، مُواظِبِينَ عَلَى الصَّلاَةِ.",ref:"رومية 12: 12",message:"تمسك بالرجاء والصلاة مهما حصل."},
  {text:"لاَ تَكُونُوا مَغْلُوبِينَ مِنَ الشَّرِّ، بَلْ اغْلِبُوا الشَّرَّ بِالْخَيْرِ.",ref:"رومية 12: 21",message:"خلي الخير أقوى من أي إساءة."},
  {text:"إِنْ كُنْتُمْ تَغْفِرُونَ لِلنَّاسِ زَلاَّتِهِمْ، يَغْفِرْ لَكُمْ أَيْضًا أَبُوكُمُ السَّمَاوِيُّ.",ref:"متى 6: 14",message:"الغفران يحرر قلبك من المرارة."},
  {text:"صَلُّوا بَعْضُكُمْ لأَجْلِ بَعْضٍ لِكَيْ تُشْفَوْا.",ref:"يعقوب 5: 16",message:"صلّي من أجل اللي حواليك."},
  {text:"اِفْرَحُوا كُلَّ حِينٍ. صَلُّوا بِلاَ انْقِطَاعٍ. اشْكُرُوا فِي كُلِّ شَيْءٍ.",ref:"1 تسالونيكي 5: 16-18",message:"الفرح والصلاة والشكر أسلوب حياة."},
  {text:"لاَ تَخَفْ أَيُّهَا الْقَطِيعُ الصَّغِيرُ، لأَنَّ أَبَاكُمْ قَدْ سُرَّ أَنْ يُعْطِيَكُمُ الْمَلَكُوتَ.",ref:"لوقا 12: 32",message:"متخافش؛ أنت في رعاية أب سماوي."},
  {text:"لَيْسَ شَيْءٌ غَيْرَ مُمْكِنٍ لَدَى اللهِ.",ref:"لوقا 1: 37",message:"إمكانيات ربنا أكبر من أي مستحيل."},
  {text:"لأَنَّهُ لَيْسَ شَيْءٌ غَيْرَ مُمْكِنٍ لَدَى اللهِ.",ref:"لوقا 1: 37",message:"صدق إن ربنا يقدر يعمل ما لا تتوقعه."},
  {text:"أَنَا مَعَكَ وَأَحْفَظُكَ حَيْثُمَا تَذْهَبُ.",ref:"تكوين 28: 15",message:"ربنا حاضر في طريقك ويحفظك."},
  {text:"لاَ تَرْهَبْ وَلاَ تَرْتَعِبْ، لأَنَّ الرَّبَّ إِلهَكَ مَعَكَ حَيْثُمَا تَذْهَبُ.",ref:"يشوع 1: 9",message:"امشِ بشجاعة لأن ربنا معاك."},
  {text:"كُنْ قَوِيًّا وَتَشَجَّعْ. لاَ تَخَفْ وَلاَ تَرْهَبْ.",ref:"تثنية 31: 6",message:"الشجاعة تبدأ من الثقة في ربنا."},
  {text:"الرَّبُّ يُحَارِبُ عَنْكُمْ وَأَنْتُمْ تَصْمُتُونَ.",ref:"خروج 14: 14",message:"أحيانًا أفضل خطوة هي إنك تسلّم المعركة لربنا."},
  {text:"الرَّبُّ حِصْنُ حَيَاتِي، مِمَّنْ أَرْتَعِبُ؟",ref:"مزمور 27: 1",message:"خلي الرب حصنك وقت الخوف."},
  {text:"الرَّبُّ قَرِيبٌ لِمَنْ يَدْعُونَهُ، لِمَنْ يَدْعُونَهُ بِالْحَقِّ.",ref:"مزمور 145: 18",message:"لما تنادي ربنا بصدق، هو قريب منك."},
  {text:"ذُوقُوا وَانْظُرُوا مَا أَطْيَبَ الرَّبَّ.",ref:"مزمور 34: 8",message:"اختبر بنفسك صلاح ربنا."},
  {text:"أَمَا أَوْصَيْتُكَ؟ تَشَدَّدْ وَتَشَجَّعْ! لاَ تَرْهَبْ وَلاَ تَرْتَعِبْ لأَنَّ الرَّبَّ إِلهَكَ مَعَكَ حَيْثُمَا تَذْهَبُ.",ref:"يشوع 1: 9",message:"خليك ثابت؛ وجود ربنا معاك يكفي."},
  {text:"مَنْ يَسْكُنْ فِي سِتْرِ الْعَلِيِّ، فِي ظِلِّ الْقَدِيرِ يَبِيتُ.",ref:"مزمور 91: 1",message:"احتمِ في ربنا واطمئن في حضرته."},
  {text:"أَمِينٌ هُوَ اللهُ الَّذِي بِهِ دُعِيتُمْ إِلَى شَرِكَةِ ابْنِهِ يَسُوعَ الْمَسِيحِ رَبِّنَا.",ref:"1 كورنثوس 1: 9",message:"ربنا أمين ومش هيسيبك."},
  {text:"وَإِلهُ السَّلاَمِ نَفْسُهُ يُقَدِّسُكُمْ بِالتَّمَامِ.",ref:"1 تسالونيكي 5: 23",message:"اطلب من إله السلام يقدس حياتك بالكامل."},
  {text:"الرَّبُّ يَهَبُ عِزًّا لِشَعْبِهِ. الرَّبُّ يُبَارِكُ شَعْبَهُ بِالسَّلاَمِ.",ref:"مزمور 29: 11",message:"اطلب قوة وسلام من ربنا كل يوم."},
  {text:"سَرَاجٌ لِرِجْلِي كَلاَمُكَ وَنُورٌ لِسَبِيلِي.",ref:"مزمور 119: 105",message:"كلمة ربنا تنورلك الطريق."},
  {text:"مَا أَحْلَى أَنْ يَكُونَ لِلإِنْسَانِ رَجَاءٌ وَيَصْبِرَ لِخَلاَصِ الرَّبِّ.",ref:"مراثي إرميا 3: 26",message:"خلي عندك رجاء واستنى عمل ربنا."},
  {text:"وَأَمَّا الرَّجَاءُ فَلاَ يُخْزِي، لأَنَّ مَحَبَّةَ اللهِ قَدِ انْسَكَبَتْ فِي قُلُوبِنَا.",ref:"رومية 5: 5",message:"رجاؤك في ربنا مش هيخذلك."},
  {text:"فَإِذًا نَسْعَى إِلَى مَا لِلسَّلاَمِ، وَمَا لِلْبُنْيَانِ بَعْضُنَا لِبَعْضٍ.",ref:"رومية 14: 19",message:"خلي وجودك يبني ويصنع سلام."},
  {text:"وَفَوْقَ جَمِيعِ هذِهِ الْبَسُوا الْمَحَبَّةَ الَّتِي هِيَ رِبَاطُ الْكَمَالِ.",ref:"كولوسي 3: 14",message:"المحبة هي أجمل ما تلبسه."},
  {text:"وَكُلُّ مَا تَفْعَلُونَهُ، فَاعْمَلُوهُ مِنَ الْقَلْبِ كَمَا لِلرَّبِّ لَيْسَ لِلنَّاسِ.",ref:"كولوسي 3: 23",message:"اعمل كل حاجة بإخلاص وكأنك بتعملها للرب."},
  {text:"وَلْيَكُنْ كَلاَمُ الْمَسِيحِ سَاكِنًا فِيكُمْ بِغِنًى.",ref:"كولوسي 3: 16",message:"خلي كلمة المسيح تسكن جواك."},
  {text:"كُونُوا لُطَفَاءَ بَعْضُكُمْ نَحْوَ بَعْضٍ، شَفُوقِينَ، مُتَسَامِحِينَ.",ref:"أفسس 4: 32",message:"اللطف والغفران بيغيروا العلاقات."},
  {text:"اِحْتَمِلُوا بَعْضُكُمْ بَعْضًا بِالْمَحَبَّةِ.",ref:"أفسس 4: 2",message:"المحبة تعلمنا نصبر على بعض."},
  {text:"لأَنَّنَا نَحْنُ عَمَلُهُ، مَخْلُوقِينَ فِي الْمَسِيحِ يَسُوعَ لأَعْمَالٍ صَالِحَةٍ.",ref:"أفسس 2: 10",message:"أنت مخلوق بقصد وليك رسالة."},
  {text:"فَوْقَ كُلِّ شَيْءٍ، خُذُوا تُرْسَ الإِيمَانِ الَّذِي بِهِ تَقْدِرُونَ أَنْ تُطْفِئُوا جَمِيعَ سِهَامِ الشِّرِّيرِ الْمُلْتَهِبَةِ.",ref:"أفسس 6: 16",message:"تمسك بالإيمان وقت الهجوم والخوف."},
  {text:"اِفْرَحُوا فِي الرَّبِّ كُلَّ حِينٍ، وَأَقُولُ أَيْضًا: افْرَحُوا.",ref:"فيلبي 4: 4",message:"فرحك الحقيقي مرتبط بالرب."},
  {text:"لاَ تَهْتَمُّوا بِشَيْءٍ، بَلْ فِي كُلِّ شَيْءٍ بِالصَّلاَةِ وَالدُّعَاءِ مَعَ الشُّكْرِ، لِتَعْلَمْ طِلْبَاتُكُمْ لَدَى اللهِ.",ref:"فيلبي 4: 6",message:"حوّل قلقك لصلاة."},
  {text:"وَسَلاَمُ اللهِ الَّذِي يَفُوقُ كُلَّ عَقْلٍ يَحْفَظُ قُلُوبَكُمْ وَأَفْكَارَكُمْ.",ref:"فيلبي 4: 7",message:"سلام ربنا يقدر يحفظ قلبك وفكرك."},
  {text:"كُلُّ مَا هُوَ حَقٌّ، كُلُّ مَا هُوَ جَلِيلٌ، كُلُّ مَا هُوَ عَادِلٌ، كُلُّ مَا هُوَ طَاهِرٌ، كُلُّ مَا هُوَ مُسِرٌّ، كُلُّ مَا صِيتُهُ حَسَنٌ، فَفِي هذِهِ افْتَكِرُوا.",ref:"فيلبي 4: 8",message:"املأ فكرك بالحاجات الصالحة."},
  {text:"وَإِلهِي يَمْلأُ كُلَّ احْتِيَاجِكُمْ بِحَسَبِ غِنَاهُ فِي الْمَجْدِ فِي الْمَسِيحِ يَسُوعَ.",ref:"فيلبي 4: 19",message:"ثق إن ربنا عارف احتياجك."},
  {text:"الرَّبُّ قَرِيبٌ. لاَ تَهْتَمُّوا بِشَيْءٍ.",ref:"فيلبي 4: 5-6",message:"افتكر دايمًا إن الرب قريب."},
  {text:"اِحْسِبُوهُ كُلَّ فَرَحٍ يَا إِخْوَتِي حِينَمَا تَقَعُونَ فِي تَجَارِبَ مُتَنَوِّعَةٍ.",ref:"يعقوب 1: 2",message:"حتى التجارب ممكن تكون طريق للنمو."},
  {text:"وَإِنَّمَا إِنْ كَانَ أَحَدُكُمْ تُعْوِزُهُ حِكْمَةٌ، فَلْيَطْلُبْ مِنَ اللهِ.",ref:"يعقوب 1: 5",message:"لما تحتار، اطلب حكمة من ربنا."},
  {text:"تَوَاضَعُوا قُدَّامَ الرَّبِّ فَيَرْفَعَكُمْ.",ref:"يعقوب 4: 10",message:"التواضع قدام ربنا يرفعك في الوقت المناسب."},
  {text:"أَلْقُوا كُلَّ هَمِّكُمْ عَلَيْهِ لأَنَّهُ هُوَ يَعْتَنِي بِكُمْ.",ref:"1 بطرس 5: 7",message:"ربنا مهتم بكل تفصيلة في حياتك."},
  {text:"وَإِلهُ كُلِّ نِعْمَةٍ... بَعْدَمَا تَأَلَّمْتُمْ يَسِيرًا، هُوَ يُكَمِّلُكُمْ وَيُثَبِّتُكُمْ وَيُقَوِّيكُمْ وَيُمَكِّنُكُمْ.",ref:"1 بطرس 5: 10",message:"بعد الألم ربنا يقدر يكملك ويثبتك."},
  {text:"نَحْنُ نُحِبُّهُ لأَنَّهُ هُوَ أَحَبَّنَا أَوَّلاً.",ref:"1 يوحنا 4: 19",message:"محبتنا لربنا بدأت من محبته لينا."},
  {text:"اللهُ مَحَبَّةٌ، وَمَنْ يَثْبُتْ فِي الْمَحَبَّةِ يَثْبُتْ فِي اللهِ وَاللهُ فِيهِ.",ref:"1 يوحنا 4: 16",message:"اثبت في المحبة، اثبت في الله."},
  {text:"لاَ نَكُنْ بِالْكَلاَمِ وَلاَ بِاللِّسَانِ، بَلْ بِالْعَمَلِ وَالْحَقِّ.",ref:"1 يوحنا 3: 18",message:"خلّي محبتك تظهر في أفعالك."},
  {text:"أَمَّا الَّذِينَ يَنْتَظِرُونَ الرَّبَّ فَيُجَدِّدُونَ قُوَّةً.",ref:"إشعياء 40: 31",message:"الانتظار مع ربنا بيجدد قوتك."},
  {text:"أَمَا أَوْصَيْتُكَ؟ تَشَدَّدْ وَتَشَجَّعْ! لاَ تَرْهَبْ وَلاَ تَرْتَعِبْ.",ref:"يشوع 1: 9",message:"خد خطوة الإيمان ومتخافش."},
  {text:"هُوَذَا مَا أَطْيَبَ وَمَا أَحْلَى أَنْ يَسْكُنَ الإِخْوَةُ مَعًا!",ref:"مزمور 133: 1",message:"الوحدة والمحبة نعمة عظيمة."}
];

let last = -1;

function showRandomVerse(){
  let i;
  do { i = Math.floor(Math.random() * verses.length); }
  while(verses.length > 1 && i === last);
  last = i;

  document.getElementById("verse").textContent = "«" + verses[i].text + "»";
  document.getElementById("ref").textContent = "— " + verses[i].ref;
}

showRandomVerse();

</script>
